services:
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    network_mode: bridge
    environment:
      - TZ=Asia/Shanghai
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_KEY=${JELLYFIN_KEY}
      - DUO_USER_ID=${DUO_USER_ID}
      - DUO_JWT_TOKEN=${DUO_JWT_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
      - TRUENAS_API_KEY=${TRUENAS_API_KEY}
      - PROXMOXVE_KEY=${PROXMOXVE_KEY}
      - MC_SERVER_URL=${MC_SERVER_URL}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - STEAM_USER_IDS=${STEAM_USER_IDS}
      - STEAM_USER=${STEAM_USER}
      - NETBIRD_API_KEY=${NETBIRD_API_KEY}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
      - KOMGA_API_KEY=${KOMGA_API_KEY}
      - LIBRARY_ID=${LIBRARY_ID}
      - LASTFM_USERNAME=${LASTFM_USERNAME}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - SYNCTHING_URL=${SYNCTHING_URL}
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY}
      - IMMICH_URL=${IMMICH_URL}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - ADGUARD_URL=${ADGUARD_URL}
      - ADGUARD_USERNAME=${ADGUARD_USERNAME}
      - ADGUARD_PASSWORD=${ADGUARD_PASSWORD}
      - HAPROXY_MONITOR_URL=${HAPROXY_MONITOR_URL}
      - NASA_API_KEY=${NASA_API_KEY}
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8081:8080

  komga-proxy:
    container_name: komga-proxy
    image: caddy:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
