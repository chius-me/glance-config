              <div class="color-negative">Komga URL or API key not set.</div>
            {{ else }}
              {{ if eq $content.Response.StatusCode 200 }}
                <div class="cards-horizontal carousel-items-container">
                  {{ $arr := $content.JSON.Array "content" }}
                  {{ $shown := 0 }}
                  {{ range $i, $_ := $arr }}
                    {{ if lt $shown $numberOfItems }}
                      {{ $el := index $arr $i }}
                      <a class="card widget-content-frame"
                         href="{{ $baseURL }}/series/{{ $el.String "id" }}"
                         style="flex:0 0 25vh; min-width: 170px; display: flex; flex-direction: column; text-decoration: none; color: inherit;">
                        <div style="position: relative;">
                          <img src="{{ $thumbnailURL }}/api/v1/series/{{ $el.String "id" }}/thumbnail"
                               alt="{{ $el.String "metadata.title" }}"
                               loading="lazy"
                               class="media-server-thumbnail shrink-0"
                               style="width: 100%; height: 37vh; min-height: 250px; display: block; border-radius: var(--border-radius) var(--border-radius) 0 0; object-fit: cover;"
                           />
                        </div>
                        <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                          <ul class="flex flex-column justify-evenly margin-bottom-3" style="height: 100%; gap: 4px;">
                            <li class="text-truncate color-primary" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="{{ $el.String "metadata.title" }}">
                              {{ $el.String "metadata.title" }}
                            </li>
                            <li style="font-size: 0.85em; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                              Added: {{ $el.String "created" | parseTime "RFC3339" | formatTime "Jan 2, 2006" }}
                            </li>
                          </ul>
                        </div>
                      </a>
                      {{ $shown = add $shown 1 }}
                    {{ end }}
                  {{ end }}
                </div>
              {{ else }}
                <div class="color-negative">Failed to fetch items (status {{ $content.Response.StatusCode }})</div>
              {{ end }}
            {{ end }}

        # ---- Komga Library (Light Novel) ----
        - type: custom-api
          title: Light novel
          frameless: true
          cache: 15m
          options:
            base-url: http://192.0.2.8:25600
            thumbnail-url: http://192.0.2.7:8083
            api-key: ${KOMGA_API_KEY}
            library-id: YOUR_LIBRARY_ID
            items: 10
            mode: new
          template: |
            {{ $baseURL := .Options.StringOr "base-url" "" }}
            {{ $thumbnailURL := .Options.StringOr "thumbnail-url" "" }}
            {{ $apiKey := .Options.StringOr "api-key" "" }}
            {{ $libraryId := .Options.StringOr "library-id" "" }}
            {{ $numberOfItems := .Options.IntOr "items" 10 }}
            {{ $mode := .Options.StringOr "mode" "new" }}
            {{
              $content := newRequest (concat $baseURL "/api/v1/series/" $mode "?library_id=" $libraryId)
                | withHeader "X-API-Key" $apiKey
                | getResponse
            }}
            {{ if or (eq $baseURL "") (eq $apiKey "") }}
              <div class="color-negative">Komga URL or API key not set.</div>
            {{ else }}
              {{ if eq $content.Response.StatusCode 200 }}
                <div class="cards-horizontal carousel-items-container">
                  {{ $arr := $content.JSON.Array "content" }}
                  {{ $shown := 0 }}
                  {{ range $i, $_ := $arr }}
                    {{ if lt $shown $numberOfItems }}
                      {{ $el := index $arr $i }}
                      <a class="card widget-content-frame"
                         href="{{ $baseURL }}/series/{{ $el.String "id" }}"
                         style="flex:0 0 25vh; min-width: 170px; display: flex; flex-direction: column; text-decoration: none; color: inherit;">
                        <div style="position: relative;">
                          <img src="{{ $thumbnailURL }}/api/v1/series/{{ $el.String "id" }}/thumbnail"
                               alt="{{ $el.String "metadata.title" }}"
                               loading="lazy"
                               class="media-server-thumbnail shrink-0"
                               style="width: 100%; height: 37vh; min-height: 250px; display: block; border-radius: var(--border-radius) var(--border-radius) 0 0; object-fit: cover;"
                           />
                        </div>
                        <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                          <ul class="flex flex-column justify-evenly margin-bottom-3" style="height: 100%; gap: 4px;">
                            <li class="text-truncate color-primary" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="{{ $el.String "metadata.title" }}">
                              {{ $el.String "metadata.title" }}
                            </li>
                            <li style="font-size: 0.85em; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                              Added: {{ $el.String "created" | parseTime "RFC3339" | formatTime "Jan 2, 2006" }}
                            </li>
                          </ul>
                        </div>
                      </a>
                      {{ $shown = add $shown 1 }}
                    {{ end }}
                  {{ end }}
                </div>
              {{ else }}
                <div class="color-negative">Failed to fetch items (status {{ $content.Response.StatusCode }})</div>
              {{ end }}
            {{ end }}

        # ---- Komga Library (Example) ----
        - type: custom-api
          title: Example Library
          frameless: true
          cache: 15m
          options:
            base-url: http://192.0.2.8:25600
            thumbnail-url: http://192.0.2.7:8083
            api-key: ${KOMGA_API_KEY}
            library-id: YOUR_LIBRARY_ID
            items: 10
            mode: new
          template: |
            {{ $baseURL := .Options.StringOr "base-url" "" }}
            {{ $thumbnailURL := .Options.StringOr "thumbnail-url" "" }}
            {{ $apiKey := .Options.StringOr "api-key" "" }}
            {{ $libraryId := .Options.StringOr "library-id" "" }}
            {{ $numberOfItems := .Options.IntOr "items" 10 }}
            {{ $mode := .Options.StringOr "mode" "new" }}
            {{
              $content := newRequest (concat $baseURL "/api/v1/series/" $mode "?library_id=" $libraryId)
                | withHeader "X-API-Key" $apiKey
                | getResponse
            }}
            {{ if or (eq $baseURL "") (eq $apiKey "") }}
              <div class="color-negative">Komga URL or API key not set.</div>
            {{ else }}
              {{ if eq $content.Response.StatusCode 200 }}
                <div class="cards-horizontal carousel-items-container">
                  {{ $arr := $content.JSON.Array "content" }}
                  {{ $shown := 0 }}
                  {{ range $i, $_ := $arr }}
                    {{ if lt $shown $numberOfItems }}
                      {{ $el := index $arr $i }}
                      <a class="card widget-content-frame"
                         href="{{ $baseURL }}/series/{{ $el.String "id" }}"
                         style="flex:0 0 25vh; min-width: 170px; display: flex; flex-direction: column; text-decoration: none; color: inherit;">
                        <div style="position: relative;">
                          <img src="{{ $thumbnailURL }}/api/v1/series/{{ $el.String "id" }}/thumbnail"
                               alt="{{ $el.String "metadata.title" }}"
                               loading="lazy"
                               class="media-server-thumbnail shrink-0"
                               style="width: 100%; height: 37vh; min-height: 250px; display: block; border-radius: var(--border-radius) var(--border-radius) 0 0; object-fit: cover;"
                           />
                        </div>
                        <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                          <ul class="flex flex-column justify-evenly margin-bottom-3" style="height: 100%; gap: 4px;">
                            <li class="text-truncate color-primary" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="{{ $el.String "metadata.title" }}">
                              {{ $el.String "metadata.title" }}
                            </li>
                            <li style="font-size: 0.85em; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                              Added: {{ $el.String "created" | parseTime "RFC3339" | formatTime "Jan 2, 2006" }}
                            </li>
                          </ul>
                        </div>
                      </a>
                      {{ $shown = add $shown 1 }}
                    {{ end }}
                  {{ end }}
                </div>
              {{ else }}
                <div class="color-negative">Failed to fetch items (status {{ $content.Response.StatusCode }})</div>
              {{ end }}
            {{ end }}

