- name: home
  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 24h
          timezone: Asia/Shanghai

        - type: weather
          location: London # example city, replace with yours
          units: metric
          hour-format: 24h

        - type: group
          widgets:
            - type: custom-api
              title: TimeFly
              body-type: string
              skip-json-validation: true
              cache: 1s
              template: |
                {{ $localTime := now }}
                {{ $secondsPerDay := 86400 }}
                {{ $elapsedSeconds := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                {{ $dayProgress := div (mul $elapsedSeconds 100.0) $secondsPerDay }}
                {{ $gradient := "" }}
                {{ if lt $dayProgress 10.0 }}
                  {{ $gradient = "#70a1ff" }}
                {{ else if lt $dayProgress 25.0 }}
                  {{ $gradient = "#ff6b6b, #70a1ff" }}
                {{ else if lt $dayProgress 50.0 }}
                  {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df" }}
                {{ else }}
                  {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df, #70a1ff" }}
                {{ end }}
                <div style="text-align: center;">
                  <div style="width: 100%; height: 12px; background: rgba(128, 128, 128, 0.15); border-radius: 10px; overflow: hidden;">
                    <div style="height: 100%; width: {{ $dayProgress }}%; background: linear-gradient(90deg, {{ $gradient }});"></div>
                  </div>
                  <div class="size-h6 margin-top-6">{{ printf "%.2f" $dayProgress }}% of the day</div>
                </div>
            - type: custom-api
              title: Month
              body-type: string
              skip-json-validation: true
              cache: 1s
              template: |
                {{ $localTime := now }}
                {{ $month := $localTime.Month }}
                {{ $dayOfMonth := $localTime.Day }}
                {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                {{ $fractionOfDay := div $secondsToday 86400.0 }}
                {{ $daysInMonth := 31 }}
                {{ if eq $month 2 }}{{ $daysInMonth = 28 }}{{ end }}
                {{ if or (eq $month 4) (eq $month 6) (eq $month 9) (eq $month 11) }}{{ $daysInMonth = 30 }}{{ end }}
                {{ $daysElapsed := add (sub $dayOfMonth 1) $fractionOfDay }}
                {{ $monthProgress := mul (div $daysElapsed $daysInMonth) 100.0 }}
                {{ $gradient := "" }}
                {{ if lt $monthProgress 10.0 }}
                  {{ $gradient = "#70a1ff" }}
                {{ else if lt $monthProgress 25.0 }}
                  {{ $gradient = "#ff6b6b, #70a1ff" }}
                {{ else if lt $monthProgress 50.0 }}
                  {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df" }}
                {{ else }}
                  {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df, #70a1ff" }}
                {{ end }}
                <div style="text-align: center;">
                  <div style="width: 100%; height: 12px; background: rgba(128, 128, 128, 0.15); border-radius: 10px; overflow: hidden;">
                    <div style="height: 100%; width: {{ $monthProgress }}%; background: linear-gradient(90deg, {{ $gradient }});"></div>
                  </div>
                  <div class="size-h6 margin-top-6">{{ printf "%.2f" $monthProgress }}% of the month</div>
                </div>
            - type: custom-api
              title: Year
              body-type: string
              skip-json-validation: true
              cache: 1s
              template: |
                {{ $localTime := now }}
                {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                {{ $dayOfYear := $localTime.YearDay }}
                {{ $secondsElapsed := add (mul (sub $dayOfYear 1) 86400) $secondsToday }}
                {{ $totalSecondsInYear := mul 365 86400 }}
                {{ $yearProgress := div (mul $secondsElapsed 100.0) $totalSecondsInYear }}
                {{ $gradient := "" }}
                {{ if lt $yearProgress 10.0 }}
                  {{ $gradient = "#70a1ff" }}
                {{ else if lt $yearProgress 25.0 }}
                  {{ $gradient = "#ff6b6b, #70a1ff" }}
                {{ else if lt $yearProgress 50.0 }}
                  {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df" }}
                {{ else }}
                  {{ $gradient = "#ff6b6b, #f8e71c, #7ed6df, #70a1ff" }}
                {{ end }}
                <div style="text-align: center;">
                  <div style="width: 100%; height: 12px; background: rgba(128, 128, 128, 0.15); border-radius: 10px; overflow: hidden;">
                    <div style="height: 100%; width: {{ $yearProgress }}%; background: linear-gradient(90deg, {{ $gradient }});"></div>
                  </div>
                  <div class="size-h6 margin-top-6">{{ printf "%.2f" $yearProgress }}% of the year</div>
                </div>

        - type: custom-api
          title: Spotify
          cache: 60s
          url: http://ws.audioscrobbler.com/2.0/
          parameters:
            method: user.getRecentTracks
            user: ${LASTFM_USERNAME}
            api_key: ${LASTFM_API_KEY}
            format: json
            limit: 10
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "recenttracks.track" }}
                <li class="flex items-center gap-10">
                  <div style="border-radius:5px;min-width:5rem;max-width:5rem;overflow:hidden;">
                    <img src="{{ .String "image.2.#text" }}" style="width:100%;">
                  </div>
                  <div>
                    <div class="color-positive size-h5">{{ .String "artist.#text" }}</div>
                    <div class="size-h5">{{ .String "name" }}</div>
                    <div class="size-h6">
                      {{ if .String "@attr.nowplaying" }}
                        <span class="color-positive">Now playing</span>
                      {{ else }}
                        <span class="color-subdue">{{ .String "date.#text" }}</span>
                      {{ end }}
                    </div>
                  </div>
                </li>
              {{ end }}
            </ul>

